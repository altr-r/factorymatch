# Local development database only. The API runs with `go run ./cmd/server`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: factorymatch
      POSTGRES_PASSWORD: factorymatch
      POSTGRES_DB: factorymatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorymatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
